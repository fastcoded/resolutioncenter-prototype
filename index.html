<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:grid;place-items:center;padding:24px;
  background:linear-gradient(160deg,#0A1A28,#0C2234 55%,#071320);
  font-family:"Segoe UI Variable Text","Segoe UI",-apple-system,system-ui,sans-serif;
  color:#EAF4F8;-webkit-font-smoothing:antialiased}
.box{width:min(420px,100%);padding:34px 32px 26px;border-radius:20px;text-align:center;
  background:rgba(10,25,37,.82);border:1px solid rgba(255,255,255,.14);
  box-shadow:0 40px 90px rgba(0,0,0,.55)}
.mark{width:44px;height:44px;border-radius:12px;margin:0 auto;display:grid;place-items:center;
  background:#13233A}
h1{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-top:16px}
p{font-size:12.5px;line-height:1.6;color:rgba(219,235,242,.66);margin:8px auto 0;max-width:300px}
form{display:flex;gap:8px;margin-top:20px}
input{flex:1;min-width:0;height:44px;padding:0 14px;border-radius:10px;color:#fff;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.18);
  font-family:inherit;font-size:13.5px;letter-spacing:.06em}
input:focus{outline:none;border-color:rgba(0,224,126,.6);box-shadow:0 0 0 4px rgba(0,224,126,.12)}
button{height:44px;padding:0 20px;border:0;border-radius:10px;background:#00C46F;color:#06251A;
  font-family:inherit;font-size:13.5px;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.err{margin-top:12px;font-size:11.5px;font-weight:600;color:#FF8A90;min-height:14px}
.note{margin-top:18px;padding-top:16px;border-top:1px solid rgba(255,255,255,.1);
  font-size:10px;color:rgba(190,214,226,.42);line-height:1.5}
</style>

  sessionStorage.setItem('rc.sealed','1');
  document.open();document.write(html);document.close();
}
f.addEventListener('submit',async ev=>{
  ev.preventDefault();
  if(!crypto.subtle){e.textContent='This page must be served over https to unlock.';return}
  b.disabled=true;e.textContent='';b.textContent='Unlocking…';
  try{await open(p.value)}
  catch(err){e.textContent='That passphrase does not match.';p.value='';b.disabled=false;b.textContent='Unlock'}
});
</script>
