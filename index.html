ice is one message from us or a thousand guesses from them. Cause and ETA up front is what keeps the queue empty."},"home.notif":{side:"l",tag:"CHANNEL",title:"A failed SMS is our problem, not theirs",body:"The delivery failure is named and the update is pinned here until read. The customer never pays for a channel we could not reach them on."},"home.resolved":{side:"l",tag:"CLEARED",title:"Announce good news as loudly as bad",body:"Resolution that arrives unprompted is the cheapest retention we buy. A customer who has to check back is already comparing wallets."},"home.partial":{side:"l",tag:"PARTIAL",title:"Lead with the number that will surprise them",body:"Rs 8,450 back, Rs 25 kept. Said here it is arithmetic; discovered later it is a dispute, and one we would probably lose."},"home.provisional":{side:"l",tag:"CREDIT",title:"Money first, reconciliation afterwards",body:"Past our own deadline the balance is whole again and we carry the wait. Our process risk stops being their cash-flow problem."},"home.row":{side:"r",tag:"STATE",title:"No row is allowed to go silent",body:"Held, processing, settled or reversed — always one of four. Ambiguity is what generates the call, so we designed it out of the list."},"home.chip":{side:"r",tag:"REASON",title:"The reason is one tap away, not one call",body:"It comes from a closed, product-owned code list — the same code the SMS carries, so two channels can never tell different stories."},"home.reason":{side:"r",tag:"TAXONOMY",title:"Written once, read everywhere",body:"Ops triage the same code the customer reads. Nobody invents a new phrasing per ticket, so the product and the agent never contradict."},"home.reversed":{side:"r",tag:"HISTORY",title:"Money that came back says so",body:"A reversal is a state, not a gap in the ledger. That distinction is the difference between a resolved case and a screenshot on Twitter."},"detail.hero":{side:"l",tag:"SUBJECT",title:"Right payment, confirmed in one glance",body:"Payee, amount and state in a single block. Every second spent checking they are on the right screen is a second closer to calling us."},"detail.timeline":{side:"l",tag:"TIMELINE",title:"A timeline ends the guessing",body:"Defined steps with times replace “is it stuck?” — the question that fills the queue. They can see what happened and what is left."},"detail.reason":{side:"r",tag:"REASON",title:"The sentence that actually calms people",body:"Why it is held, in plain words, ending on the line that matters most: your money has not left your account."},"detail.fraud":{side:"r",tag:"SECURITY",title:"Say plainly what we cannot say",body:"Confidentiality is defensible; silence is not. Naming the limit stops a legitimate hold from reading as an accusation."},"detail.outage":{side:"r",tag:"INCIDENT",title:"One story, repeated identically everywhere",body:"The row, the banner and this screen say the same sentence. A per-transaction excuse here would contradict the status page — and a customer who catches us contradicting ourselves calls."},"detail.outagesla":{side:"r",tag:"ETA",title:"Still a deadline, just the right one",body:"We never drop the commitment during an incident; we swap a countdown we cannot honour for the restoration time we can. A stated ETA is what stops the refresh-and-retry loop."},"detail.sla":{side:"r",tag:"SLA",title:"A deadline we can be judged on",body:"Published at the moment of failure, not on request. It is also the number ops now has to hit — which is the point."},"detail.sla48":{side:"r",tag:"SLA·48H",title:"Publish the slower number and hit it",body:"Forty-eight hours met builds more trust than twenty-four promised and missed. Honesty about pace is cheaper than optimism."},"detail.breach":{side:"r",tag:"BREACH",title:"We announce our own miss",body:"Told before they notice, with a fresh committed hour and the party we are chasing. The promise survives the breach."},"detail.provisional":{side:"l",tag:"CREDIT",title:"Our reconciliation, our problem",body:"The money is spendable again while we settle with the biller behind the scenes. The customer is not our float."},"detail.cap":{side:"l",tag:"CAP",title:"Quote the rule, never judge the customer",body:"Three credits in 30 days, stated plainly. The guardrail protects the P&L without implying anybody has done something wrong."},"detail.partial":{side:"l",tag:"PARTIAL",title:"Name who kept the money",body:"A smaller refund with no explanation reads as theft. With the fee named and attributed, it reads as a receipt."},"detail.breakdown":{side:"l",tag:"LEDGER",title:"Three rows beat a paragraph",body:"Principal, fee, net. They can check our arithmetic against their own in one glance — and stop looking for the missing money."},"detail.resolved":{side:"l",tag:"CLOSED",title:"Beat the estimate out loud",body:"Thirty-two minutes early, said where the customer can see it. Scoring our own promise in public is what makes the next one credible."},"detail.notif":{side:"r",tag:"CHANNEL",title:"The app is the record of truth",body:"Channels fail: SIM swaps, DND, dead numbers. The record inside the product cannot go missing, so that is where the truth lives."},"detail.facts":{side:"r",tag:"RECEIPT",title:"Everything an agent would ask for, already here",body:"Reference, biller, consumer number, fee. If a call ever happens it starts at second zero instead of five minutes of hunting."},"detail.report":{side:"r",tag:"ACTION",title:"The entire escalation path is one button",body:"Raised from the transaction itself, pre-filled and locked. No helpline, no reference to dictate, no queue to sit in."},"offline.strip":{side:"l",tag:"OFFLINE",title:"Stale data, labelled as stale",body:"The last status we genuinely had, with its timestamp. Manufactured freshness is how an app and an SMS end up contradicting each other."},"sheet.locked":{side:"l",tag:"PREFILL",title:"Nothing to retype, nothing to mistype",body:"Amount, time and reference come from the transaction. Every field we ask them to fill is a field that can arrive wrong and cost a triage."},"sheet.reasons":{side:"l",tag:"ROUTING",title:"Free text never becomes the routing key",body:"Fixed options map to the taxonomy ops already triage on, so a report lands in the right queue the first time."},"sheet.duplicate":{side:"l",tag:"MERGE",title:"A second message, not a second case",body:"The open report is recognised before they type. They see one conversation; the agent sees one case; nobody works it twice."},"sheet.succession":{side:"l",tag:"ROUTE",title:"Refusing the wrong queue is the kind answer",body:"A dispute cannot help an estate, so the product will not raise one. Sending them somewhere useless would only cost them weeks."},"sheet.documents":{side:"l",tag:"REQUIREMENTS",title:"Name the documents before the journey",body:"The three papers succession actually needs, listed here — not discovered at a branch counter after a wasted afternoon."},"sheet.evidence":{side:"r",tag:"EVIDENCE",title:"Invited, never required",body:"A screenshot helps the reviewer, but demanding one blocks the people least able to provide it. Filing must never depend on it."},"sheet.promise":{side:"r",tag:"SLA",title:"The promise sits above the button",body:"They know the turnaround before committing, not after. That is the difference between a decision and a leap of faith."},"sheet.submit":{side:"r",tag:"COMMIT",title:"The button says exactly what will happen",body:"Submit, or add to the existing report. A merge that surprises someone is a merge they will phone us about."},"confirm.head":{side:"l",tag:"RECEIPT",title:"Acknowledged in seconds, and specifically",body:"Not a generic thank-you: it names the payment we are looking into. Vague acknowledgement is why people call back to check."},"confirm.ref":{side:"l",tag:"REFERENCE",title:"The artefact people phone us to get",body:"Issued instantly, copyable, and quotable anywhere. Handing it over up front removes an entire category of contact."},"confirm.next":{side:"l",tag:"PROCESS",title:"Three steps, not “we will be in touch”",body:"Who does what, and how long each part takes. Uncertainty is what drives the follow-up call, so we remove the uncertainty."},"confirm.sla":{side:"r",tag:"PROMISE",title:"A dated promise, not a vague one",body:"By 2:15 PM tomorrow — specific enough to be measured, reported on, and missed visibly if we get it wrong."},"confirm.channel":{side:"r",tag:"NOTIFY",title:"Tell them where to expect us",body:"The channel is confirmed on screen, so waiting is passive rather than anxious. Checking back is a behaviour we are designing out."},"account.why":{side:"l",tag:"CAUSE",title:"Cite the rule, not “security reasons”",body:"An expired CNIC and the State Bank requirement behind it. A cited rule is arguable and actionable; a vague one is just frightening."},"account.succession":{side:"l",tag:"LEGAL",title:"Legal, and said so",body:"The copy states estate law explicitly, so a grieving family is never left reading themselves as a fraud risk."},"account.action":{side:"l",tag:"REMEDY",title:"Exactly one thing to do",body:"One document, uploaded on the same screen that explains it. Every extra step here is a customer who stays restricted."},"account.time":{side:"l",tag:"SLA",title:"Our side of the work has a clock too",body:"Verified within two hours of upload. Asking for something without saying when we will act on it is where trust leaks away."},"account.works":{side:"r",tag:"CAPABILITY",title:"A limited account is not a dead one",body:"Receiving, balance, bills and top-ups spelled out. Customers who believe the account is frozen move their salary elsewhere."},"account.blocked":{side:"r",tag:"SCOPE",title:"Short, exact, no surprises at the counter",body:"The blocked list is stated here so nobody discovers a restriction in front of an agent, with a queue behind them."},"account.safe":{side:"r",tag:"REASSURANCE",title:"Say the sentence they are looking for",body:"Their money is safe and earning as normal. It is the only question they actually opened this screen to answer."},"reports.unread":{side:"l",tag:"INBOX",title:"Critical updates cannot expire unseen",body:"An update we failed to deliver stays pinned until it has been read. Anything important is too important to lose to a carrier."},"reports.ticket":{side:"l",tag:"THREAD",title:"The promise travels with the case",body:"Reference, state and deadline stay together for the life of the report, so the commitment is still visible days later."},"reports.empty":{side:"l",tag:"EMPTY",title:"Even empty, it sets the expectation",body:"It says what will appear here and with what. An empty screen that explains itself is one fewer reason to contact us."},"system.cause":{side:"l",tag:"CAUSE",title:"Name the cause, not “technical difficulties”",body:"A banking partner connection, scoped to what is affected and honest about what still works. Specifics are what stop speculation."},"system.means":{side:"l",tag:"GUIDANCE",title:"Money is safe. Do not retry. Do not call.",body:"The three things a worried customer needs, in that order. A retry is how one incident becomes two payments to reconcile."},"system.times":{side:"r",tag:"CLOCK",title:"Say when we will speak again",body:"Started, expected fix, next update. A promised next update is what stops thousands of people checking every few minutes."},"send.payee":{side:"l",tag:"PAYEE",title:"The payee is a thing with a state",body:"Not a static row. It is added, activated and eventually ready — and the product should show which, exactly as it does for a payment."},"send.state":{side:"l",tag:"READINESS",title:"Readiness, displayed rather than guessed",body:"Customers currently learn our activation lag by trial and error. Showing it turns a mysterious error into an expected few seconds."},"send.activating":{side:"r",tag:"ACTIVATION",title:"Hold the button, not the bad news",body:"A payment sent now would be rejected by the bank. Gating the action costs seconds; an unexplained rejection costs a support contact."},"se e us an SLA we can report on rather than aspire to."],account:["Retention under friction","A limited account should not feel like a dead one","Citing the rule, naming the single action that clears it, and listing what still works keeps balances and habits in place while compliance does its job."],reports:["The operating record","One thread, one case, one story","Customers stop repeating themselves and agents stop rebuilding context. The same headcount closes more cases a day, with a cleaner audit trail behind each one."],system:["Incident credibility","One honest story protects the brand","In an outage the choice is one clear message or thousands of contradictory ones. A cause, an ETA and “do not retry” is the difference between a bad hour and a bad week."],"detail:sla_breached":["Missing our own deadline","We announce the breach before the customer finds it","Telling people we are late, with a new committed time, is far cheaper than the call that follows them discovering it. The promise survives the miss."],"detail:provisional":["The lever · Provisional credit","Return the money before the investigation ends","Past our own deadline the balance is made whole and we carry the reconciliation. Cash-flow risk moves from the customer to us — deliberately, and at a price we control."],"detail:abuse":["Credit cap","A guardrail we can state out loud","Three provisional credits in 30 days, quoted to the customer. The rule protects the P&L without accusing anyone of anything."],"detail:partial":["Partial reversal","A short refund explained is not a dispute","Naming who kept the fee turns a suspicious shortfall into arithmetic the customer can check. Disputes we would have lost never get raised."],"detail:fraud":["Security hold","Honesty about what we cannot say","We protect the detection logic and are still straight about the wait. Forty-eight hours, said at the start, stops a hold from becoming a complaint we cannot answer."],"detail:offline":["Offline","Stale data, labelled as stale","A timestamp on a cached status prevents the app and the SMS contradicting each other — the contradiction that produces the angriest calls."],"detail:resolved":["The good ending","Closing the loop is the cheapest retention we buy","Resolution announced early, with no check-back required. The customer keeps the habit, and we keep the balance."],"sheet:duplicate":["Duplicate reports","A second complaint should not become a second case","The open report is recognised before the customer types a word. One thread for them, one case for the agent, and no double handling in the queue."],"sheet:dormant":["Succession","The wrong queue is worse than no queue","Routing an estate to the documented process protects the family and keeps the case out of a dispute queue that was never able to resolve it."],"account:dormant":["Succession","A freeze that is legal, not suspicious","Saying “estate law” rather than “security review” is the difference between a grieving family and a complaint to the regulator."],"confirm:dormant":["Succession","A named officer beats a ticket number","Even the slowest legal path carries a published commitment. Two working days, to a person with a name."],"confirm:fraud":["Security review","Publish the slower number, then hit it","Forty-eight hours promised and met builds more trust than twenty-four promised and missed."],"home:restricted":["The limit, announced","Nobody should discover a restriction at the till","A limit found at the moment of payment is a complaint; the same limit announced here is a task with one clear action. Same rule, a fraction of the cost to serve."],"detail:outage":["Mass outage","The incident owns every screen it touches","A per-transaction excuse here would contradict the status page, and one caught contradiction costs more trust than the outage itself. Same cause, same ETA, same sentence — wherever the customer looks."],"home:outage":["Mass outage","One message beats a thousand contradictions","Rows read paused, neve
